name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: bash tool/run.sh bash tool/prepare.sh android
      - name: Постоянный ключ подписи (иначе обновления не встанут поверх старой версии)
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; echo "ключ подписи подключён"; else echo "::warning::нет секрета ANDROID_KEYSTORE_B64 — APK подписан случайным ключом"; fi
      - run: bash tool/run.sh flutter test
      - run: bash tool/run.sh flutter build apk --release
      - run: mkdir -p out && cp build/app/outputs/flutter-apk/app-release.apk out/Rates-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  linux:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: bash tool/run.sh bash tool/prepare.sh linux
      - run: bash tool/run.sh flutter build linux --release
      - run: |
          mkdir -p out
          cp -r build/linux/x64/release/bundle rates
          cp assets/icon.png rates/icon.png
          tar -czf out/Rates-Linux-x64.tar.gz rates
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out/* }
      - name: Скриншоты для проверки (ветка ci-shots)
        if: github.ref == 'refs/heads/main'
        run: |
          sudo apt-get install -y xvfb imagemagick xdotool >/dev/null
          P=~/.local/share/club.kolobas58.rates
          shot() {  # $1 — имя, $2 — настройки, $3 — ширина окна (необязательно), $4 — действие xdotool после запуска
            rm -rf "$P"; mkdir -p "$P"; echo "$2" > "$P/shared_preferences.json"
            W="${3:-}"; A="${4:-true}"
            xvfb-run -a -s "-screen 0 1200x900x24" bash -c "./rates/rates & sleep 6; [ -n '$W' ] && xdotool search --onlyvisible --class rates windowsize $W 860 windowmove 340 20; sleep 7; $A; sleep 1; import -window root shots/$1.png; kill %1" || true
          }
          mkdir -p shots
          shot light '{"flutter.theme":"light"}'
          shot dark '{"flutter.theme":"dark","flutter.favs":["RUB","GEL"],"flutter.world":true,"flutter.amount":500.0,"flutter.base":"USD","flutter.from":"USD"}'
          shot wide '{"flutter.theme":"light","flutter.favs":["RUB","GEL","EUR"],"flutter.world":true}' 1180
          shot pick '{"flutter.theme":"light","flutter.world":true}' 520 "xdotool mousemove 613 490 click 1"
          shot mains '{"flutter.theme":"light","flutter.mains":["EUR","VND"],"flutter.world":true,"flutter.from":"VND","flutter.base":"VND","flutter.amount":1000000.0}'
          # проверка автообновления: копия программы «думает», что она 1.0.0, качает последний релиз, при закрытии подменяет файлы
          rm -rf /tmp/upd && cp -r rates /tmp/upd && md5_before=$(md5sum /tmp/upd/lib/libapp.so | cut -c1-8)
          rm -rf "$P"; mkdir -p "$P"; echo '{"flutter.theme":"light"}' > "$P/shared_preferences.json"
          xvfb-run -a -s "-screen 0 1200x900x24" bash -c "cd /tmp/upd && RATES_TEST_VERSION=1.0.0 ./rates & sleep 30; import -window root shots/update.png; xdotool mousemove 757 100 click 1; sleep 14; import -window root shots/update2.png; pkill -f /tmp/upd/rates" || true
          echo "::notice title=autoupdate::libapp.so $md5_before -> $(md5sum /tmp/upd/lib/libapp.so | cut -c1-8) | $(tr '\n' ' ' < /tmp/rates_update.log 2>/dev/null | tail -c 900)"
          cd shots && git init -q && git checkout -q -b ci-shots && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "shots ${{ github.sha }}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: bash tool/run.sh bash tool/prepare.sh windows
        shell: bash
      - run: bash tool/run.sh flutter build windows --release
        shell: bash
      - name: Проверка автообновления на Windows
        shell: pwsh
        run: |
          Copy-Item -Recurse build/windows/x64/runner/Release C:\upd
          $before = (Get-FileHash C:\upd\data\app.so).Hash.Substring(0,8)
          $env:RATES_TEST_VERSION = '1.0.0'; $env:RATES_TEST_AUTOAPPLY = '1'
          $p = Start-Process C:\upd\rates.exe -PassThru
          $p | Wait-Process -Timeout 90 -ErrorAction SilentlyContinue
          Start-Sleep 15
          $after = (Get-FileHash C:\upd\data\app.so).Hash.Substring(0,8)
          $log = (Get-Content "$env:TEMP\rates_update.log" -ErrorAction SilentlyContinue) -join ' | '
          Write-Output "::notice title=autoupdate-win::app.so $before -> $after | $log"
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release Rates
          Compress-Archive -Path Rates -DestinationPath out/Rates-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  # выпуск: метка v* или коммит в main с «[release]» в сообщении (версия — из pubspec.yaml)
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "tag=v$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          body: |
            **Курс валют by kolobas58** — бат, доллар, СНГ и весь мир. Курсы — с kolobas58.club, без интернета показывает последний сохранённый.
            - Windows: `Rates-Windows-x64.zip` — распаковать, запустить `rates.exe`
            - Linux: `Rates-Linux-x64.tar.gz` — распаковать, запустить `rates/rates`
            - Android: `Rates-Android.apk` — установить (разрешить установку из этого источника)
